        if (!isStartTime((ev && ev.message) || (ev && ev.error && ev.error.message))) return;
        try { ev.preventDefault(); ev.stopImmediatePropagation(); } catch (e) {}

        if (!proto || !proto[name] || proto[name].__checkappPatched) return;
        var orig = proto[name];

          return filterEntries(orig.apply(this, arguments));
        }
        wrapped.__checkappPatched = true;
        try { proto[name] = wrapped; } catch (e) {}

        wrapGetter(window.PerformanceObserverEntryList && PerformanceObserverEntryList.prototype, "getEntries");
        wrapGetter(window.PerformanceObserverEntryList && PerformanceObserverEntryList.prototype, "getEntriesByType");
        wrapGetter(window.PerformanceObserverEntryList && PerformanceObserverEntryList.prototype, "getEntriesByName");

  <script>
    (function () {
      /* classic mode: the original rustapp.io design never enables the
         rc-home / rc-dash / rc-panel-home / rc-app-bg replacement layers */
      if (window.__RC_CLASSIC__) return;
      var p = location.pathname || "/";
      if (p === "/" || p.replace(/\/+$/, "") === "" || p === "/index.html" || /^\/client\/auth/.test(p)) {
        document.documentElement.classList.add("checkapp-home", "rc-home-on");
      }
      if (p !== "/" && p !== "/index.html" && !/^\/client\/auth/.test(p)) {
        document.documentElement.classList.add("rc-app-bg");
      }
      if (/^\/[^/]+\/home(?:\/|$)/i.test(p)) {
        document.documentElement.classList.add("rc-panel-home-on");
      }
      if (/^\/client\/profile/.test(p) || p === "/profile") {
        document.documentElement.classList.add("rc-profile-on", "rc-dash-on");
      }
    })();
